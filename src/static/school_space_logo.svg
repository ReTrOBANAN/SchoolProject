<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="School Space logo">
  <defs>
    <style>
      .cap { fill: #738290; }
      .bubble-left { fill: #f74f57; }
      .bubble-right { fill: #C2D8B9; }
      .text { fill: #738290; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
      .stroke-white { stroke: #ffffff; stroke-width: 18; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- background (transparent) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Left speech bubble (red) -->
  <g transform="translate(130,330)">
    <path class="bubble-left" d="
      M0 0
      h260
      a40 40 0 0 1 40 40
      v160
      a40 40 0 0 1 -40 40
      h-120
      l-40 50
      v-50
      h-100
      a40 40 0 0 1 -40 -40
      v-160
      a40 40 0 0 1 40 -40
      z" />
  </g>

  <!-- Right speech bubble (green) -->
  <g transform="translate(320,320)">
    <path class="bubble-right" d="
      M0 0
      h260
      a40 40 0 0 1 40 40
      v160
      a40 40 0 0 1 -40 40
      h-120
      l-40 50
      v-50
      h-100
      a40 40 0 0 1 -40 -40
      v-160
      a40 40 0 0 1 40 -40
      z" />
  </g>

  <!-- White inner outline to create separation between overlapping shapes -->
  <g class="stroke-white" fill="none" transform="translate(0,0)">
    <!-- outline around left bubble -->
    <path d="M130 330 h260 a40 40 0 0 1 40 40 v160 a40 40 0 0 1 -40 40 h-120 l-40 50 v-50 h-100 a40 40 0 0 1 -40 -40 v-160 a40 40 0 0 1 40 -40 z" />
    <!-- outline around right bubble -->
    <path d="M320 320 h260 a40 40 0 0 1 40 40 v160 a40 40 0 0 1 -40 40 h-120 l-40 50 v-50 h-100 a40 40 0 0 1 -40 -40 v-160 a40 40 0 0 1 40 -40 z" />
  </g>

  <!-- Speech dots on left bubble -->
  <g transform="translate(220,410)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="48" cy="0" r="14" fill="#ffffff" />
    <circle cx="96" cy="0" r="14" fill="#ffffff" />
  </g>

  <!-- Mortarboard cap -->
  <g transform="translate(200,120) scale(1)">
    <!-- cap top -->
    <polygon class="cap" points="200,0 40,70 200,140 360,70" />
    <!-- cap base -->
    <rect class="cap" x="120" y="120" width="160" height="60" rx="18" />
    <!-- tassel cord (thin) -->
    <path d="M360 70 q20 10 12 40 q-6 18 -18 20 q-8 1 -18 -8" stroke="#738290" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tassel -->
    <path d="M360 190 q15 28 0 45 q-14 17 -30 0 q-16 -17 0 -45 z" fill="#738290" transform="translate(-40,-40) scale(0.9)"/>
  </g>

  <!-- Brand text -->
  <text x="400" y="760" font-size="88" text-anchor="middle" class="text">SCHOOL</text>
  <text x="400" y="850" font-size="88" text-anchor="middle" class="text">SPACE</text>
</svg>
